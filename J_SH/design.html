<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitsch Tamagotchi Smart Home</title>
    <!-- 귀여운 도트 느낌의 폰트(NeoDunggeunmo) 로드 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodunggeunmo/neodunggeunmo@v1.5.0/neodunggeunmo.css">
    <style>
        :root {
            --bg-color: #ffd1dc;
            --main-pink: #ff6b8b;
            --yellow: #ffe66d;
            --mint: #4ecdc4;
            --purple: #a084dc;
            --screen-bg: #9bbc0f;
            --screen-dark: #0f380f;
            --screen-light: #8bac0f;
            --window-border: #000000;
        }

        * {
            box-sizing: border-box;
            font-family: 'NeoDunggeunmo', cursive, monospace;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(#fff 20%, transparent 20%),
                radial-gradient(#fff 20%, transparent 20%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 각 페이지 단위 */
        .page {
            display: none;
            width: 100%;
            max-width: 480px;
        }

        .page.active {
            display: block;
        }

        /* 와이드 레이아웃 (스마트홈 제어 전용) */
        .page-wide {
            display: none;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .page-wide.active {
            display: block;
        }

        /* 다마고치 본체 패널 (로그인 / 캐릭터 선택창용) */
        .tamagotchi-frame {
            background-color: var(--main-pink);
            border: 6px solid #000;
            border-radius: 40px 40px 60px 60px;
            padding: 25px;
            box-shadow: 8px 8px 0px #000, inset -5px -5px 0px rgba(0, 0, 0, 0.2);
            position: relative;
            width: 100%;
            max-width: 480px;
        }

        .title-banner {
            background: var(--yellow);
            border: 3px solid #000;
            padding: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 4px 4px 0px #000;
            margin-bottom: 20px;
            transform: rotate(-1deg);
        }

        .input-group {
            margin: 15px 0;
            text-align: center;
        }

        .pixel-input {
            width: 90%;
            padding: 10px;
            border: 3px solid #000;
            border-radius: 10px;
            font-size: 15px;
            text-align: center;
            outline: none;
            box-shadow: 3px 3px 0px #000;
            margin-bottom: 8px;
        }

        .kitsch-btn {
            width: 100%;
            background: var(--mint);
            color: #000;
            border: 3px solid #000;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s;
            margin-top: 8px;
        }

        .kitsch-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        /* 홈 / 로그인 전용 스타일 */
        .home-logo {
            text-align: center;
            font-size: 60px;
            margin: 10px 0;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* 메인 네비게이션 메뉴 */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        /* 캐릭터 선택 화면 */
        .char-select-container {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .char-card {
            background: #fff;
            border: 3px solid #000;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s;
            width: 30%;
            box-shadow: 3px 3px 0px #000;
        }

        .char-card:hover {
            transform: translateY(-5px);
            background: #fff8d6;
        }

        .char-card.selected {
            background: var(--mint);
            transform: scale(1.05);
            box-shadow: 4px 4px 0px #000;
        }

        .char-avatar {
            font-size: 40px;
            margin-bottom: 5px;
            display: block;
        }

        /* 와이드 레이아웃 그리드 */
        .desktop-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            align-items: center;
            justify-items: center;
            width: 100%;
        }

        @media (min-width: 850px) {
            .desktop-layout {
                grid-template-columns: 1fr 340px 1fr;
            }
        }

        /* 다마고치 기기 모양 (가운데 배치) */
        .tamagotchi-device {
            background-color: var(--main-pink);
            border: 6px solid #000;
            border-radius: 110px 110px 130px 130px;
            padding: 30px 25px 35px 25px;
            box-shadow: 8px 8px 0px #000, inset -6px -6px 0px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 340px;
            position: relative;
            text-align: center;
        }

        .tamagotchi-decorations {
            margin-top: -10px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #fff;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 2px;
        }

        /* 레트로 LCD 스크린 */
        .lcd-screen {
            background-color: var(--screen-bg);
            border: 4px solid #000;
            border-radius: 15px;
            padding: 15px;
            box-shadow: inset 3px 3px 10px rgba(0, 0, 0, 0.3);
            color: var(--screen-dark);
            position: relative;
            overflow: hidden;
            text-align: left;
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px dashed var(--screen-dark);
            padding-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
        }

        /* 캐릭터 통로 & 무빙 애니메이션 */
        .pet-stage {
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .pet-display {
            font-size: 50px;
            position: absolute;
            animation: walkBounce 1.5s infinite alternate ease-in-out;
        }

        @keyframes walkBounce {
            0% { transform: translateX(-40px) translateY(0); }
            50% { transform: translateX(0) translateY(-8px); }
            100% { transform: translateX(40px) translateY(0); }
        }

        .screen-footer {
            display: flex;
            justify-content: space-between;
            border-top: 2px dashed var(--screen-dark);
            padding-top: 5px;
            font-size: 11px;
            margin-top: 5px;
            font-weight: bold;
        }

        /* 물리 버튼 스타일 */
        .physical-buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .phy-btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .phy-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 4px solid #000;
            cursor: pointer;
            box-shadow: 0px 4px 0px #000;
            transition: all 0.1s;
            outline: none;
        }

        .phy-btn:active {
            transform: translateY(3px);
            box-shadow: 0px 1px 0px #000;
        }

        .phy-btn.yellow { background: var(--yellow); }
        .phy-btn.mint { background: var(--mint); }
        .phy-btn.purple { background: var(--purple); }

        .btn-label {
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 0px #000;
        }

        /* 주변 창 스타일 (OS 스타일 윈도우) */
        .retro-window {
            background: #fff;
            border: 4px solid var(--window-border);
            border-radius: 12px;
            box-shadow: 6px 6px 0px var(--window-border);
            width: 100%;
            max-width: 320px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .retro-window.pink-theme .window-titlebar { background: var(--main-pink); }
        .retro-window.purple-theme .window-titlebar { background: var(--purple); }
        .retro-window.mint-theme .window-titlebar { background: var(--mint); }

        .window-titlebar {
            color: #000;
            border-bottom: 4px solid var(--window-border);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }

        .window-title {
            letter-spacing: 1px;
        }

        .window-btn-close {
            width: 16px;
            height: 16px;
            border: 2px solid var(--window-border);
            background: #ff5e5e;
            box-shadow: 1px 1px 0px var(--window-border);
            border-radius: 2px;
            cursor: pointer;
        }

        .window-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fff8f8;
        }

        /* 컨트롤 카드 아이템 */
        .control-item {
            background: #fff;
            border: 3px solid #000;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.1);
        }

        .control-item label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 13px;
            color: #000;
        }

        .val-display {
            font-size: 13px;
            font-weight: bold;
            float: right;
            color: var(--main-pink);
        }

        /* 스위치 & 슬라이더 커스텀 */
        .toggle-btn {
            background: #000;
            color: #fff;
            border: 3px solid #000;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            width: 100%;
            margin-top: 3px;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.2);
        }

        .toggle-btn.off {
            background: #eee;
            color: #000;
        }

        input[type=range] {
            width: 100%;
            accent-color: #000;
            cursor: pointer;
        }

        .touch-pad {
            background: #000;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 2px;
            border: 3px solid #000;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.2);
            transition: all 0.1s;
        }

        .touch-pad:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px rgba(0, 0, 0, 0.2);
        }

        .user-welcome {
            text-align: center;
            background: #fff;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- PAGE 1: 홈 / 로그인 화면 -->
    <div id="page-home" class="page active">
        <div class="tamagotchi-frame">
            <div class="title-banner">★ TAMAGOTCHI HOME ★</div>
            <div class="home-logo">👾</div>

            <div id="login-form">
                <p style="text-align: center; font-weight: bold; margin-bottom: 10px;">로그인 해주세요!</p>
                <div class="input-group">
                    <input type="text" id="user-id" class="pixel-input" placeholder="아이디 입력" value="tamagotchi">
                    <input type="password" id="user-pw" class="pixel-input" placeholder="비밀번호 입력" value="1234">
                </div>
                <button class="kitsch-btn" onclick="handleLogin()">로그인하기 ➔</button>
            </div>

            <!-- 로그인 완료 후 보일 메뉴 -->
            <div id="logged-in-menu" style="display: none;">
                <div class="user-welcome">
                    환영합니다, <b id="user-display-name">집사</b>님!
                </div>
                <div class="menu-container">
                    <button class="kitsch-btn" style="background: var(--yellow);" onclick="goToPage('page-select')">🐱
                        캐릭터 선택 / 변경하기</button>
                    <button class="kitsch-btn" style="background: var(--mint);" onclick="goToPage('page-smarthome')">🏠
                        스마트홈 제어판 입장</button>
                    <button class="kitsch-btn" style="background: #ff8b8b; color: #fff;" onclick="handleLogout()">🔒
                        로그아웃</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PAGE 2: 캐릭터 선택 화면 -->
    <div id="page-select" class="page">
        <div class="tamagotchi-frame">
            <div class="title-banner">★ 메이트 선택 ★</div>
            <p style="text-align: center; font-size: 14px; font-weight: bold;">함께할 캐릭터를 골라주세요!</p>

            <div class="char-select-container">
                <div class="char-card selected" onclick="selectCharacter('고양이', '🐱')">
                    <span class="char-avatar">🐱</span>
                    <span>야옹이</span>
                </div>
                <div class="char-card" onclick="selectCharacter('강아지', '🐶')">
                    <span class="char-avatar">🐶</span>
                    <span>멍멍이</span>
                </div>
                <div class="char-card" onclick="selectCharacter('햄스터', '🐹')">
                    <span class="char-avatar">🐹</span>
                    <span>햄찌</span>
                </div>
            </div>

            <div class="input-group">
                <input type="text" id="pet-name-input" class="pixel-input" placeholder="이름을 입력하세요" value="나비"
                    maxlength="6">
            </div>

            <button class="kitsch-btn" onclick="saveCharacterAndGoHome()">설정 완료 & 스마트홈 이동 ➔</button>
            <button class="kitsch-btn" style="background: #fff;" onclick="goToPage('page-home')">⬅ 홈으로 돌아가기</button>
        </div>
    </div>

    <!-- PAGE 3: 스마트홈 제어 화면 (와이드 3열 레이아웃) -->
    <div id="page-smarthome" class="page-wide">
        <div class="desktop-layout">
            
            <!-- Left Column: 온습도 제어 창 -->
            <div class="retro-window mint-theme">
                <div class="window-titlebar">
                    <span class="window-title">🌡️ CLIMATE CONTROLLER</span>
                    <div class="window-btn-close" onclick="goToPage('page-home')"></div>
                </div>
                <div class="window-body">
                    <!-- 1. 온도 -->
                    <div class="control-item">
                        <label>🌡️ 온도 <span id="temp-val" class="val-display">24°C</span></label>
                        <input type="range" min="16" max="30" value="24" oninput="updateTemp(this.value)">
                    </div>

                    <!-- 2. 습도 -->
                    <div class="control-item">
                        <label>💧 습도 <span id="humidity-val" class="val-display">50%</span></label>
                        <input type="range" min="20" max="80" value="50" oninput="updateHumidity(this.value)">
                    </div>
                </div>
            </div>

            <!-- Center Column: 다마고치 기기 -->
            <div class="tamagotchi-device">
                <div class="tamagotchi-decorations">★ TAMAGOTCHI ★</div>
                
                <div class="lcd-screen">
                    <div class="screen-header">
                        <span id="display-pet-name">나비</span>
                        <span id="touch-status">상태: 평화로움</span>
                    </div>

                    <!-- 다마고치 캐릭터 영역 -->
                    <div class="pet-stage">
                        <div id="pet-avatar-display" class="pet-display">🐱</div>
                    </div>
                    
                    <!-- LCD 하단 온습도 연동 정보 -->
                    <div class="screen-footer">
                        <span>T: <span id="lcd-temp-val">24°C</span></span>
                        <span>H: <span id="lcd-humid-val">50%</span></span>
                        <span>LED: <span id="lcd-led-val">ON</span></span>
                    </div>
                </div>

                <!-- 물리 버튼 3개 -->
                <div class="physical-buttons-container">
                    <div class="phy-btn-wrapper">
                        <button class="phy-btn yellow" onclick="triggerTouch()"></button>
                        <span class="btn-label">A: 쓰다듬기</span>
                    </div>
                    <div class="phy-btn-wrapper">
                        <button class="phy-btn mint" onclick="toggleLED()"></button>
                        <span class="btn-label">B: 조명제어</span>
                    </div>
                    <div class="phy-btn-wrapper">
                        <button class="phy-btn purple" onclick="goToPage('page-select')"></button>
                        <span class="btn-label">C: 캐릭터</span>
                    </div>
                </div>
            </div>

            <!-- Right Column: 조명 및 상호작용 창 -->
            <div class="retro-window purple-theme">
                <div class="window-titlebar">
                    <span class="window-title">💡 LIGHTS & ACTIONS</span>
                    <div class="window-btn-close" onclick="goToPage('page-home')"></div>
                </div>
                <div class="window-body">
                    <!-- 3. LED 조명 -->
                    <div class="control-item">
                        <label>💡 LED 조명</label>
                        <button id="led-btn" class="toggle-btn" onclick="toggleLED()">상태: ON</button>
                    </div>

                    <!-- 4. 밝기 -->
                    <div class="control-item">
                        <label>☀️ 밝기 <span id="bright-val" class="val-display">80%</span></label>
                        <input type="range" min="0" max="100" value="80" oninput="updateBrightness(this.value)">
                    </div>

                    <!-- 5. 터치 센서 -->
                    <div class="control-item">
                        <label>🖐️ 터치 센서</label>
                        <div class="touch-pad" onclick="triggerTouch()">다마고치 쓰다듬기 (클릭!)</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- 하단 공통 네비게이션 버튼 -->
        <div class="bottom-menu" style="display: flex; gap: 15px; margin-top: 25px; width: 100%; justify-content: center;">
            <button class="kitsch-btn" style="background: var(--yellow); max-width: 180px; margin: 0;" onclick="goToPage('page-select')">⚡ 캐릭터 변경</button>
            <button class="kitsch-btn" style="background: #fff; max-width: 180px; margin: 0;" onclick="goToPage('page-home')">🏠 메인 홈으로</button>
        </div>
    </div>

    <script>
        // 상태 관리 변수
        let isLoggedIn = false;
        let selectedPet = { type: '고양이', icon: '🐱' };
        let isLedOn = true;

        // 페이지 이동 제어 함수
        function goToPage(pageId) {
            // 로그인 상태가 아닐 때 다른 페이지 접근 제한
            if (!isLoggedIn && pageId !== 'page-home') {
                alert('먼저 로그인 해주세요!');
                return;
            }

            // 페이지 활성화
            document.querySelectorAll('.page, .page-wide').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // 로그인 처리
        function handleLogin() {
            const userId = document.getElementById('user-id').value.trim();
            const userPw = document.getElementById('user-pw').value.trim();

            if (!userId || !userPw) {
                alert('아이디와 비밀번호를 입력해주세요!');
                return;
            }

            // 단순 데모용 로그인 (실제 프론트엔드 예시)
            isLoggedIn = true;
            document.getElementById('user-display-name').innerText = userId;
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('logged-in-menu').style.display = 'block';
        }

        // 로그아웃 처리
        function handleLogout() {
            isLoggedIn = false;
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('logged-in-menu').style.display = 'none';
            document.getElementById('user-id').value = '';
            document.getElementById('user-pw').value = '';
            goToPage('page-home');
        }

        // 캐릭터 선택 처리
        function selectCharacter(type, icon) {
            selectedPet = { type, icon };

            const cards = document.querySelectorAll('.char-card');
            cards.forEach(card => card.classList.remove('selected'));

            event.currentTarget.classList.add('selected');
        }

        // 캐릭터 설정 저장 후 스마트홈 페이지로 이동
        function saveCharacterAndGoHome() {
            const nameInput = document.getElementById('pet-name-input').value.trim();
            const petName = nameInput ? nameInput : selectedPet.type;

            document.getElementById('display-pet-name').innerText = petName;
            document.getElementById('pet-avatar-display').innerText = selectedPet.icon;

            goToPage('page-smarthome');
        }

        // 스마트홈 제어 함수들
        function updateTemp(val) {
            document.getElementById('temp-val').innerText = val + '°C';
            const lcdTemp = document.getElementById('lcd-temp-val');
            if (lcdTemp) lcdTemp.innerText = val + '°C';
        }

        function updateHumidity(val) {
            document.getElementById('humidity-val').innerText = val + '%';
            const lcdHumid = document.getElementById('lcd-humid-val');
            if (lcdHumid) lcdHumid.innerText = val + '%';
        }

        // 밝기 제어
        function updateBrightness(val) {
            document.getElementById('bright-val').innerText = val + '%';
        }

        function toggleLED() {
            isLedOn = !isLedOn;
            const btn = document.getElementById('led-btn');
            const lcdLed = document.getElementById('lcd-led-val');
            if (isLedOn) {
                if (btn) {
                    btn.innerText = "상태: ON";
                    btn.classList.remove('off');
                }
                if (lcdLed) lcdLed.innerText = "ON";
            } else {
                if (btn) {
                    btn.innerText = "상태: OFF";
                    btn.classList.add('off');
                }
                if (lcdLed) lcdLed.innerText = "OFF";
            }
        }

        function triggerTouch() {
            const statusEl = document.getElementById('touch-status');
            const petEl = document.getElementById('pet-avatar-display');

            statusEl.innerText = "상태: 기분 좋음! ♥";
            petEl.style.transform = "scale(1.3)";

            setTimeout(() => {
                statusEl.innerText = "상태: 평화로움";
                petEl.style.transform = "scale(1)";
            }, 1000);
        }
    </script>
</body>

</html>
